<!doctype html>
<html lang="en">
<head>

<title>Small Days</title>
<style>
  :root {

    --bright: #c8ffcf;

    --warn: #ffd84a;
    --danger: #ff5a5a;
    --gold: #ffcf5a;
    --border: #2a4a2e;
  }
  body[data-time="morning"]   { --panel: #12190f; }
  body[data-time="afternoon"] { --panel: #101710; }
  body[data-time="evening"]   { --panel: #14130f; }
  body[data-time="night"]     { --panel: #0c0f16; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .frame {
    width: 100%;
    max-width: 720px;
    border: 2px solid var(--border);
    background: var(--panel);
    box-shadow: 0 0 24px rgba(125, 255, 138, 0.08);
    transition: background 0.6s;
  }
  section { padding: 12px 16px; border-bottom: 2px solid var(--border); }
  section:last-child { border-bottom: none; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .title { font-weight: bold; letter-spacing: 2px; }
  .mood { font-size: 18px; margin-left: 6px; }
  .sub { color: var(--dim); margin-top: 2px; }
  .sub b { color: var(--fg); font-weight: normal; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .cols { grid-template-columns: 1fr; } }
  .row { display: flex; gap: 8px; white-space: pre; }
  .label { width: 8ch; }
  .bar { letter-spacing: -1px; }
  .val { min-width: 4ch; text-align: right; }
  .stars { color: var(--gold); letter-spacing: -1px; }
  .xpbar { color: var(--dim); letter-spacing: -1px; }
  .warn { color: var(--warn); }
  .danger { color: var(--danger); }
  .colhead { color: var(--dim); margin-bottom: 4px; }
  #log { height: 300px; overflow-y: auto; }
  #log div { color: var(--dim); margin-bottom: 2px; }
  #log div:first-child { color: var(--fg); }
  #log .big { color: var(--gold); border: 1px solid var(--gold); padding: 2px 8px; margin: 4px 0; }
  #log .news { font-style: italic; color: #9fd8a6; }
  #log .thought { font-style: italic; color: var(--warn); }
  #log .summary { color: var(--bright); border-left: 3px solid var(--dim); padding-left: 8px; white-space: pre-wrap; }
  .group { margin-bottom: 8px; }
  .group-title { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--fg);
    padding: 5px 10px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--fg); color: var(--bg); }
  button:disabled { color: var(--dim); border-color: var(--dim); cursor: not-allowed; }
  button.selected { background: var(--fg); color: var(--bg); }
  .key { opacity: 0.6; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
  input[type=text] {
    font: inherit; background: var(--bg); color: var(--fg);
    border: 1px solid var(--fg); padding: 6px 10px; width: 100%; max-width: 280px;
  }
  .choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .choice-grid button { text-align: left; }
  .choice-grid small { display: block; opacity: 0.75; white-space: normal; }
  .setup-title { font-size: 20px; letter-spacing: 3px; }
  .hidden { display: none; }
</style>
</head>

<!-- ================= SETUP SCREEN ================= -->
<div class="frame" id="setup">

  </section>

  <section>

  </section>
  <section>

    <div class="choice-grid" id="careerChoices"></div>
  </section>
  <section>
    <button id="startBtn">▶ Start your life</button>
  </section>
</div>

<!-- ================= GAME SCREEN ================= -->

  <section>
    <div id="actions"></div>

</div>

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const pad = h => String(h).padStart(2, "0") + ":00";
const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const level = sk => Math.min(10, Math.floor(state.skills[sk] / 100));
const maxEnergy = () => 100 + 5 * level("fitness");
const maxOf = k => (k === "energy" ? maxEnergy() : 100);
const hasTrait = t => state.trait === t;
const dayName = d => DAYS[(d - 1) % 7];
const isWeekend = () => (state.day - 1) % 7 >= 5;
const career = () => CAREERS[state.career.track];
const rankInfo = () => career().ranks[state.career.rank - 1];
const workClose = () => (hasTrait("nightowl") ? 23 : 21);
const isRainy = () => state.weather.name === "Rainy";

function clampNeeds() {
  for (const k in state.needs) state.needs[k] = Math.max(0, Math.min(maxOf(k), Math.round(state.needs[k])));
}

function log(text, cls = "") {
  state.log.unshift({ text: `> ${pad(state.hour)} ${text}`, cls });
  state.log.length = Math.min(state.log.length, 30);
}
function logRaw(text, cls = "") {
  state.log.unshift({ text, cls });
  state.log.length = Math.min(state.log.length, 30);
}

function bar(v, max, width = 20) {
  const filled = Math.max(0, Math.min(width, Math.round((v / max) * width)));
  return "[" + "█".repeat(filled) + "░".repeat(width - filled) + "]";
}

function levelClass(v) { return v < 15 ? "danger" : v < 30 ? "warn" : ""; }

function moodEmoji() {
  const n = state.needs;
  const avg = (n.energy / maxEnergy() * 100 + n.hunger + n.fun) / 3;
  return avg >= 70 ? "😄" : avg >= 50 ? "🙂" : avg >= 30 ? "😐" : "😟";
}

function timeOfDay() {
  const h = state.hour;
  if (h < 12) return { key: "morning", emoji: "🌅" };
  if (h < 17) return { key: "afternoon", emoji: "🌞" };
  if (h < 21) return { key: "evening", emoji: "🌆" };
  return { key: "night", emoji: "🌙" };
}

function gainXP(sk, amt) {
  const t = TRAITS[state.trait];
  if (t.skill === sk) amt *= 1.5;
  amt = Math.round(amt);
  const before = level(sk);
  state.skills[sk] = Math.min(1000, state.skills[sk] + amt);
  state.today.xp += amt;
  const after = level(sk);
  if (after > before) {
    log(`⭐ ${SKILL_LABELS[sk].toUpperCase()} LEVEL ${after}! ${pick(LEVELUP_QUIPS[sk])}`, "big");
  }
}

const costOf = a => (a.cost ? a.cost(state) : 0);

function canDo(a) {
  if (a.available) {
    const ok = a.available(state);
    if (ok !== true) return ok;
  }
  if (a.open) {
    if (state.hour < a.open[0]) return `Opens at ${pad(a.open[0])}`;
    if (state.hour + a.hours > a.open[1]) return `Closes at ${pad(a.open[1])}`;
  }
  const c = costOf(a);
  if (c > 0 && state.money < c) return `Not enough money ($${c})`;
  if (!a.isSleep && state.hour + a.hours > 24) return "Too late. Time for bed.";
  return true;
}

function checkPromotion() {
  const c = state.career;
  if (c.rank >= maxRank()) return;
  const [s1, s2] = career().skills;
  if (c.shiftsAtRank >= shiftNeed() && c.perf >= 60 && level(s1) >= skillNeed() && level(s2) >= skillNeed()) {
    c.rank++;
    c.shiftsAtRank = 0;
    c.perf = 55;
    const r = rankInfo();
    log(`★ PROMOTED: ${r.title.toUpperCase()} ★  Pay is now $${r.pay}/shift.`, "big");
    log(pick(c.rank >= 7 ? PROMO_QUIPS_WEIRD : PROMO_QUIPS_NORMAL));
    if (c.rank === maxRank()) log(`🌌 You have reached the end of the ${career().name} ladder. There is nowhere left to climb. Only sideways. Or up, into the void.`, "big");
  }
}

function promotionHint() {
  const c = state.career;
  if (c.rank >= maxRank()) return "You ARE the ladder now.";
  const [s1, s2] = career().skills;
  const need = [];
  if (level(s1) < skillNeed()) need.push(`${SKILL_LABELS[s1]} ${skillNeed()}`);
  if (level(s2) < skillNeed()) need.push(`${SKILL_LABELS[s2]} ${skillNeed()}`);
  if (c.shiftsAtRank < shiftNeed()) need.push(`${shiftNeed() - c.shiftsAtRank} more shifts`);
  if (c.perf < 60) need.push("Perf 60");
  return need.length ? "Next promo: " + need.join(", ") : "Promotion ready next shift!";
}

function advanceTime(hours) {
  for (let i = 0; i < hours; i++) {
    state.hour++;
    state.needs.energy -= DECAY.energy;
    state.needs.hunger -= DECAY.hunger + (hasTrait("athletic") ? 1 : 0);
    state.needs.fun -= DECAY.fun;
    clampNeeds();
  }
}

function checkThoughts() {
  for (const k in state.needs) {
    const pct = state.needs[k] / maxOf(k) * 100;
    if (pct < 30 && !state.thoughtsShown[k]) {
      state.thoughtsShown[k] = true;
      log(`💭 ${pick(THOUGHTS[k])}`, "thought");
    } else if (pct >= 40) {
      state.thoughtsShown[k] = false;
    }
  }
}

function daySummary() {
  const t = state.today;
  const n = state.needs;
  if (!isWeekend() && !state.career.shiftDone) {
    state.career.perf = Math.max(0, state.career.perf - 10);
    log("📉 You skipped work today. Your boss noticed the empty desk.", "thought");
  }
  const earned = state.money - t.money;
  const perfDelta = state.career.perf - t.perf;
  const mood = (n.energy / maxEnergy() * 100 + n.hunger + n.fun) / 3;
  const score = mood * 0.5 + Math.min(50, Math.max(0, earned) / 2 + t.xp / 4);
  const grade = score >= 85 ? "A+" : score >= 75 ? "A" : score >= 65 ? "B" : score >= 50 ? "C" : score >= 35 ? "D" : "F";
  const sign = v => (v >= 0 ? "+" : "") + v;
  logRaw(
    `── ${dayName(state.day)} · Day ${state.day} recap ──\n` +
    `Money ${sign(earned)}   Skill XP +${t.xp}   Performance ${sign(perfDelta)}\n` +
    `Day grade: ${grade}`,
    "summary"
  );
}

function morningBriefing() {
  const total = WEATHER.reduce((a, w) => a + w.weight, 0);
  let r = Math.random() * total;
  state.weather = WEATHER.find(w => (r -= w.weight) < 0) || WEATHER[0];
  state.today = { money: state.money, xp: 0, perf: state.career.perf };
  const weekendNote = isWeekend() ? " It's the weekend, so no work!" : "";
  log(`☀️ ${dayName(state.day)}, Day ${state.day}. ${state.weather.emoji} ${state.weather.name}.${weekendNote}`);
  const famous = state.career.rank >= 6 && Math.random() < 0.6;
  const headline = famous ? pick(FAME_HEADLINES).replace("{name}", state.name) : pick(HEADLINES);
  log(`📰 "${headline}"`, "news");
}

function newDay(msg) {
  daySummary();
  state.day++;
  state.hour = 8;
  state.needs.hunger = Math.max(5, state.needs.hunger - 15);
  state.career.shiftDone = false;
  state.career.overtimeDone = false;
  if (msg) log(msg);
  morningBriefing();
}

function sleep(forced) {
  if (forced && !hasTrait("nightowl")) {
    log("🌙 You collapse into bed, exhausted.");
    state.needs.energy = 60;
    state.needs.fun -= 10;
    clampNeeds();
    newDay("You wake up groggy.");
  } else {
    log(forced ? "🦉 Midnight? Pfft. You drift off whenever you feel like it." :
      pick(["🌙 You climb into bed. Goodnight.", "🌙 You fall asleep mid-thought.", "🌙 You count sheep. You lose count at 7."]));
    state.needs.energy = maxEnergy();
    newDay();
  }
}

function checkPassOut() {
  const n = state.needs;
  if (n.energy <= 0) {
    log("💫 You pass out from exhaustion! Medical bill −$20.");
    state.money -= 20;
    n.energy = 60;
    newDay("You wake up in a daze.");
    return true;
  }
  if (n.hunger <= 0) {
    log("💫 You faint from hunger! Medical bill −$20.");
    state.money -= 20;
    n.hunger = 30;
    n.energy = Math.max(n.energy, 50);
    newDay("You wake up starving but alive.");
    return true;
  }
  if (n.fun <= 0) {
    log("😩 You have a breakdown and call it a day.");
    n.fun = 40;
    n.energy = Math.max(n.energy, 50);
    newDay("A fresh start. Maybe go easy today.");
    return true;
  }
  return false;
}

let jobBoardOpen = false;

function doAction(a) {
  if (canDo(a) !== true) return;
  if (a.special === "jobboard") { jobBoardOpen = true; render(); return; }
  if (a.isSleep) { sleep(false); render(); return; }

  state.money -= costOf(a);
  if (hasTrait("nightowl") && state.hour < 10) {
    state.needs.energy -= 5;
    log("🦉 Mornings are not your thing. −5 energy.", "thought");
  }
  a.effect(state);
  clampNeeds();
  advanceTime(a.hours);
  if (a.after) { a.after(state); clampNeeds(); }

  if (!checkPassOut()) {
    checkThoughts();
    if (state.hour >= 24) sleep(true);
    else maybeEvent();
  }
  render();
}

// ---------- Random events ----------
let pendingEvent = null;

function maybeEvent() {
  if (Math.random() >= 0.25) return;
  const r = state.career.rank, x = Math.random();
  // the further you get, the weirder it gets
  const tier = r >= 7 ? (x < 0.6 ? 2 : x < 0.85 ? 1 : 0)
             : r >= 4 ? (x < 0.15 ? 2 : x < 0.65 ? 1 : 0)
             : (x < 0.15 ? 1 : 0);
  pendingEvent = pick(EVENTS.filter(e => e.tier === tier));
}

function resolveEvent(choice) {
  const result = choice.fn(state);
  pendingEvent = null;
  state.career.perf = Math.max(0, Math.min(100, state.career.perf));
  for (const k in state.neighbors) state.neighbors[k] = Math.min(100, state.neighbors[k]);
  clampNeeds();
  log(result);
  if (!checkPassOut()) checkThoughts();
  render();
}

function switchCareer(id) {
  jobBoardOpen = false;
  if (id && id !== state.career.track) {
    state.career = { track: id, rank: 1, shiftsAtRank: 0, perf: 50, shiftDone: state.career.shiftDone, overtimeDone: state.career.overtimeDone };
    log(`📋 You quit and started over as a ${rankInfo().title} in ${career().name}. Bold move.`, "big");
  }
  render();
}

// =====================================================================
// RENDER
// =====================================================================
let shownActions = [];
const KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "q", "w", "e", "r", "t", "y", "u", "i", "o", "p"];

function render() {
  const tod = timeOfDay();
  document.body.dataset.time = tod.key;
  document.getElementById("clock").textContent =
    `${tod.emoji} ${dayName(state.day)} · Day ${state.day} · ${pad(state.hour)} ${state.weather.emoji}`;
  document.getElementById("mood").textContent = moodEmoji();

  const t = TRAITS[state.trait];
  const c = state.career;
  document.getElementById("identity").innerHTML =
    `<b>${esc(state.name)}</b> · ${t.emoji} ${t.name} · ${career().emoji} <b>${rankInfo().title}</b> (Perf ${c.perf}) · ${promotionHint()}`;

  // Needs column
  let html = `<div class="colhead">Needs</div>`;
  for (const k in state.needs) {
    const v = state.needs[k], max = maxOf(k);
    const cls = levelClass(v / max * 100);
    html += `<div class="row ${cls}"><span class="label">${NEED_LABELS[k]}</span>` +
            `<span class="bar">${bar(v, max, 16)}</span><span class="val">${v}</span>${cls ? "<span>⚠</span>" : ""}</div>`;
  }
  html += `<div class="row ${state.money < 0 ? "danger" : ""}"><span class="label">Money</span><span>$${state.money}</span></div>`;
  document.getElementById("needs").innerHTML = html;

  // Skills column
  let sk = `<div class="colhead">Skills</div>`;
  for (const s of SKILLS) {
    const lvl = level(s);
    const prog = lvl >= 10 ? 10 : Math.floor((state.skills[s] % 100) / 10);
    sk += `<div class="row"><span class="label">${SKILL_LABELS[s]}</span>` +
          `<span class="stars">${"★".repeat(lvl)}${"☆".repeat(10 - lvl)}</span>` +
          `<span class="xpbar">${"▮".repeat(prog)}${"▯".repeat(10 - prog)}</span></div>`;
  }
  document.getElementById("skills").innerHTML = sk;

  // Log
  document.getElementById("log").innerHTML =
    state.log.map(l => `<div class="${l.cls}">${esc(l.text)}</div>`).join("");

  // Actions
  const box = document.getElementById("actions");
  box.innerHTML = "";
  shownActions = [];

  if (pendingEvent) {
    const ev = pendingEvent;
    const tierLabel = ["❗ Something happens…", "🌀 Something odd happens…", "🌌 SOMETHING COSMIC HAPPENS"][ev.tier];
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = `<div class="group-title">${tierLabel}</div><div style="margin-bottom:8px;color:var(--bright)">${esc(ev.text)}</div>`;
    const btns = document.createElement("div");
    btns.className = "btns";
    ev.choices.forEach((c, i) => {
      shownActions.push({ eventChoice: c });
      const b = document.createElement("button");
      b.innerHTML = `<span class="key">${KEYS[i].toUpperCase()}</span> ${esc(c.label)}`;
      b.onclick = () => resolveEvent(c);
      btns.appendChild(b);
    });
    g.appendChild(btns);
    box.appendChild(g);
    return;
  }

  if (jobBoardOpen) {
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = `<div class="group-title">📋 Job board: switching careers resets you to rank 1</div>`;
    const btns = document.createElement("div");
    btns.className = "btns";
    for (const id in CAREERS) {
      const cc = CAREERS[id];
      const b = document.createElement("button");
      b.textContent = `${cc.emoji} ${cc.name} (${cc.skills.map(x => SKILL_LABELS[x]).join("+")})`;
      b.disabled = id === state.career.track;
      if (b.disabled) b.title = "Your current career";
      b.onclick = () => switchCareer(id);
      btns.appendChild(b);
    }
    const back = document.createElement("button");
    back.textContent = "← Never mind";
    back.onclick = () => switchCareer(null);
    btns.appendChild(back);
    g.appendChild(btns);
    box.appendChild(g);
    return;
  }

  const groups = {};
  for (const a of ACTIONS) (groups[a.group] = groups[a.group] || []).push(a);
  for (const gName in groups) {
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = `<div class="group-title">${gName}</div>`;
    const btns = document.createElement("div");
    btns.className = "btns";
    for (const a of groups[gName]) {
      const idx = shownActions.length;
      shownActions.push(a);
      const ok = canDo(a);
      const b = document.createElement("button");
      const cost = costOf(a);
      const label = a.labelFn ? a.labelFn() :
        `${a.label}${a.hours && !a.isSleep ? ` ${a.hours}h` : ""}${cost ? ` $${cost}` : ""}`;
      b.innerHTML = `<span class="key">${KEYS[idx].toUpperCase()}</span> ${a.emoji} ${esc(label)}`;
      b.disabled = ok !== true;
      if (ok !== true) b.title = ok;
      b.onclick = () => doAction(a);
      btns.appendChild(b);
    }
    g.appendChild(btns);
    box.appendChild(g);
  }
}

document.addEventListener("keydown", e => {
  if (!state.started || e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (jobBoardOpen) {
    if (k === "escape") switchCareer(null);
    return;
  }
  const i = KEYS.indexOf(k);
  if (i < 0 || !shownActions[i]) return;
  if (shownActions[i].eventChoice) resolveEvent(shownActions[i].eventChoice);
  else doAction(shownActions[i]);
});

// =====================================================================
// SETUP SCREEN
// =====================================================================
function buildChoices(containerId, data, key, onPick) {
  const box = document.getElementById(containerId);
  box.innerHTML = "";
  for (const id in data) {
    const d = data[id];
    const b = document.createElement("button");
    b.innerHTML = `${d.emoji} ${d.name}<small>${key(d)}</small>`;
    b.dataset.id = id;
    b.onclick = () => {
      onPick(id);
      [...box.children].forEach(c => c.classList.toggle("selected", c.dataset.id === id));
    };
    box.appendChild(b);
  }
}

buildChoices("traitChoices", TRAITS, d => d.desc, id => (state.trait = id));
buildChoices("careerChoices", CAREERS,
  d => `${d.ranks[0].title} → ${d.ranks[5].title} → ???. Needs ${d.skills.map(x => SKILL_LABELS[x]).join(" + ")}.`,
  id => (state.career.track = id));
document.querySelector('#traitChoices [data-id="athletic"]').classList.add("selected");
document.querySelector('#careerChoices [data-id="office"]').classList.add("selected");

document.getElementById("startBtn").onclick = () => {
  state.name = document.getElementById("nameInput").value.trim() || "Sam";
  state.started = true;
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  morningBriefing();
  log(`🏠 ${state.name} moves into a tiny apartment on Maple Street with $50 and a suspicious houseplant.`);
  log(`💼 First day as a ${rankInfo().title}. ${pick(["Try not to trip.", "You ironed your shirt. Mostly.", "Your mom texted 'good luck!!!' with 9 emojis."])}`);
  render();
};
</script>
